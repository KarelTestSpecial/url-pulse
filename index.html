<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL-Pulse</title>
    <!-- Voeg hier eventueel een link naar een CSS-bestand toe -->
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>URL-Pulse</h1>

    <div id="auth-section">
        <h2>Login / Register</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Wachtwoord" required>
        <button onclick="handleSignUp()">Sign Up</button>
        <button onclick="handleLogIn()">Log In</button>
    </div>

    <div id="dashboard-section" style="display:none;">
        <h2>Dashboard</h2>
        <p>Ingelogd als: <strong id="user-email"></strong></p>
        <button onclick="handleLogOut()">Log Out</button>

        <hr>

        <h3>My URLs</h3>
        <input type="text" id="new-url" placeholder="https://voorbeeld.com">
        <button onclick="handleAddUrl()">Add URL</button>

        <ul id="url-list">
            <!-- URLs worden hier dynamisch geladen -->
        </ul>
    </div>

    <!-- DEZE REGEL IS NU 100% CORRECT ZONDER SPATIES -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Uw eigen applicatielogica -->
    <script src="app.js"></script>
</body>
</html>
